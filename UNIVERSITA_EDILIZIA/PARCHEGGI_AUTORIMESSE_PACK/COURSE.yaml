fonti: "L. 9/1/1989 n. 122 (Tognoli, con modifiche 2020 da verificare), D.M. 1/2/1986 (antincendio autorimesse), DPR 151/2011 (prevenzione incendi oltre 300 m2), D.M. 3/8/2015 (Codice prevenzione incendi), D.M. 236/1989 (accessibilita'), D.P.R. 380/2001 (titoli e agibilita'), NTC D.M. 17/1/2018 (carichi veicolari, barriere), UNI EN 1991-1-1 (carichi), UNI EN 14010 (parcheggi meccanizzati), Direttiva Macchine 2006/42/CE, D.Lgs 257/2016 (DAFI), CEI 64-8 Sez. 722 (ricarica EV), art. 1122-bis c.c., Dir. (UE) 2024/1275 EPBD (predisposizione), UNI EN 12101 (controllo fumi), D.Lgs 285/1992 (segnaletica), D.Lgs 152/2006 (acque); regolamenti comunali citati come da verificare"
nota_metodologica: "Corso tipologico su parcheggi e autorimesse: standard e Tognoli (1 m2/10 m2, modifiche 2020), geometria (stalli 2,50x5,00, disabili 3,00x4,50, corsie 4,50-7,00, altezze 2,20), rampe (20% rettilinee, doppi raccordi, drenaggi), interrati (platea, setti, falda, vasca stagna, maglia pilastri per gli stalli), antincendio D.M. 1/2/1986 e DPR 151/2011 (>300 m2), ventilazione CO a domanda, silos e coperture (barriere veicolari), meccanizzati (car stacker, puzzle, torri, UNI EN 14010, manutenzione obbligatoria), ricarica EV (D.Lgs 257/2016, CEI 64-8/722, 1122-bis c.c., gestione carichi), esterni (pavimentazioni, drenaggio, segnaletica, verde), patologie e manutenzione (infiltrazioni, carbonatazione, giunti), economia per posto auto. NON ridondante: nessun pack esistente tratta parcheggi; impermeabilizzazione interrati solo di rinvio a IMPERMEABILIZZAZIONI_SPECIALI_PACK; INFRASTRUTTURE_VERDI_BLU per l'invarianza idraulica. Norme solo di consolidata certezza; prezzi come fasce indicative; nessun nome di azienda."
