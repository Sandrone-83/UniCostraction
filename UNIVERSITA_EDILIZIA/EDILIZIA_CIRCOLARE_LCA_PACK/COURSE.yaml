nota_metodologica: "Metodo LCA, EPD, embodied carbon, design for disassembly, demolizione selettiva, riuso, CAM, LCC, rifiuti di cantiere, filiere di riciclo, strumenti digitali, economia della circolarita'. Norme citate solo dove di consolidata certezza; decreti End of Waste e soglie RENTRI in forma prudente ('da verificare nella versione vigente'); i valori economici sono ordini di grandezza con forte variabilita' regionale; recepimento nazionale EPBD sul GWP del ciclo di vita da verificare sui decreti attuativi."
