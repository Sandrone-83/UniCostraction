schema_campi: [categoria, nome, descrizione, tecnologia, applicazioni, vantaggi, limiti, costi_e_economia, casi_real_world, normative, note_cantiere]
fonti: "Reg. UE 305/2011 (CPR), Reg. UE 1025/2012, D.Lgs 106/2017, Direttiva UE 2024/1275 (EPBD), Direttiva UE 2023/2413 (RED III) e D.Lgs 5/2026, Reg. UE 2024/1781 (ESPR), serie EN 1990-1999 (Eurocodici) con Annessi Nazionali, D.M. 17/1/2018 (NTC), ISO/IEC 17025, IBC/IRC (ICC), ASCE 7, ACI 318, AISC 360, NFPA 101/5000/13, ICC-ES, art. 1669 c.c., D.Lgs 36/2023, DPR 380/2001, D.Lgs 152/2006; banche dati NANDO/EOTA/Accredia"
nota_metodologica: "Il SISTEMA normativo come soggetto (non i singoli contenuti tecnici): gerarchia delle fonti (regolamenti, direttive, decreti, norme volontarie, guide), CPR e requisiti di base, marcatura CE e DoP (contenuti e limiti: NPD, AVCP, organismi notificati), via ETA/EAD/EOTA per i prodotti senza norma armonizzata, norme armonizzate e presunzione di conformita' (citazioni in GUUE, ritiri, coesistenze), sistema Eurocodici EN 1990-1999 con NDP e Annessi Nazionali, doppio binario NTC 2018/Eurocodici, direttive che ridisegnano l'edilizia (EPBD, RED III, ESPR) e stato di recepimento, codici americani (IBC/IRC, ASCE 7, LRFD, ACI/AISC, NFPA, AHJ, submittals), lettura delle sigle ISO/EN/UNI (TS, TR, prEN, corrigendum), verifica di certificati e marchi (NANDO, EOTA, Accredia, falsi documentali), norma nel contratto e in cantiere (richiami, accettazione, art. 1669). NON ridondante: CPR/CE/Eurocodici compaiono nei pack tecnici solo come citazioni; qui sono l'oggetto del corso (verifica grep 28/10/2026). Riferimenti normativi solo di consolidata certezza; revisione CPR e seconda generazione Eurocodici indicate come in corso, da verificare su fonti ufficiali; nessun nome di azienda."
